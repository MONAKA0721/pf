version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    # Skip releases younger than a few days so a compromised or broken
    # release has time to be pulled before it reaches this site.
    cooldown:
      default-days: 3
    groups:
      # One PR per week for every minor/patch update, and one per security fix
      # batch, instead of one PR per package.
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
